<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2532">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Planner">
<title>Travel Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf7f2;
  --card: #ffffff;
  --ink: #1f2430;
  --muted: #6b7280;
  --line: #e7e2da;
  --accent: #c2703e;
  --accent-ink: #ffffff;
  --booked: #2f9e6b;
  --booked-bg: #e3f5ec;
  --pending: #d98a1e;
  --pending-bg: #fff2dc;
  --unknown: #8b8f9a;
  --unknown-bg: #eceef2;
  --head1: #1e2532;
  --head2: #2f3a4d;
  --weekend: #f3ede3;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 20, 40, .06), 0 6px 20px rgba(20, 20, 40, .06);
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Playfair Display", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-bottom: 76px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; margin: 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.sr { position: absolute; left: -9999px; }

/* Header */
.hdr {
  background: linear-gradient(135deg, var(--head1), var(--head2));
  color: #fff; padding: 12px 16px 14px; position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
.hdr-row { display: flex; align-items: center; gap: 10px; }
.hdr-in { max-width: 760px; margin: 0 auto; }
.hdr h1 { font-size: 20px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .sub { font-size: 12.5px; opacity: .8; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ibtn {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); color: #fff;
  border-radius: 10px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.ibtn:active { background: rgba(255,255,255,.25); }
.badge-shared { background: #3b82f6; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; letter-spacing: .3px; }

/* Filters */
.filters { display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px;
  font-size: 13.5px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; font-weight: 500;
}
.chip .n { background: var(--unknown-bg); color: var(--muted); border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 600; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.on .n { background: rgba(255,255,255,.2); color: #fff; }

/* Timeline */
.main { max-width: 760px; margin: 0 auto; padding: 8px 16px 24px; }
.day { margin: 14px 0 4px; }
.day-h { display: flex; align-items: baseline; gap: 10px; padding: 8px 4px 6px; border-bottom: 2px solid var(--line); position: sticky; top: 74px; background: var(--bg); z-index: 5; }
.day.weekend .day-h { background: var(--weekend); border-radius: 8px 8px 0 0; padding-left: 10px; padding-right: 10px; border-bottom-color: #dccfba; }
.day.weekend { background: var(--weekend); border-radius: 8px; padding: 0 0 6px; }
.day-h .dn { font-family: var(--font-head); font-size: 17px; }
.day-h .dd { color: var(--muted); font-size: 13px; }
.day-h .dc { color: var(--muted); font-size: 12px; margin-left: auto; }
.day-h .add { margin-left: 6px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; width: 30px; height: 30px; font-size: 20px; line-height: 1; }
.day.today .day-h .dn::after { content: "Today"; font: 600 10px var(--font-body); background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
.day.empty { margin: 4px 0 0; }
.day.empty .day-h { border-bottom: 1px solid var(--line); padding-top: 5px; padding-bottom: 5px; position: static; }
.day.empty .day-h .dn { font-size: 15px; }
.day.empty .day-h .dc { font-style: italic; }
.day.empty .day-h .add { width: 26px; height: 26px; font-size: 17px; background: #e8d9c8; color: var(--accent); }
.day.weekend.empty { padding-bottom: 0; }
.item {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin: 8px 4px;
  padding: 11px 13px 11px 14px; border-left: 5px solid var(--unknown); display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px;
  cursor: pointer; transition: transform .08s;
}
.item:active { transform: scale(.995); }
.item.booked { border-left-color: var(--booked); }
.item.pending { border-left-color: var(--pending); }
.item.unknown { border-left-color: var(--unknown); }
.item .ic { font-size: 22px; line-height: 1.2; text-align: center; grid-row: span 3; }
.item .t { font-weight: 600; font-size: 15.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.item .d { color: #444a56; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.item .m { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.sb { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .3px; text-transform: uppercase; }
.sb.booked { background: var(--booked-bg); color: var(--booked); }
.sb.pending { background: var(--pending-bg); color: var(--pending); }
.sb.unknown { background: var(--unknown-bg); color: var(--unknown); }
.ob { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #4356c9; }
.ob.client { background: #fdecf1; color: #b3305d; }

/* Empty state */
.welcome { text-align: center; padding: 48px 20px; }
.welcome h2 { font-size: 26px; margin-bottom: 8px; }
.welcome p { color: var(--muted); max-width: 420px; margin: 0 auto 20px; }

/* Buttons */
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 15px; }
.btn.sec { background: var(--unknown-bg); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: #c0392b; color: #fff; }
.btn.sm { padding: 7px 11px; font-size: 13.5px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn-row .grow { flex: 1; }

/* Modal */
.ov { position: fixed; inset: 0; background: rgba(20, 22, 30, .5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .ov { align-items: center; padding: 20px; } }
.md {
  background: var(--card); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0;
  padding: 18px 18px 26px; box-shadow: 0 -4px 30px rgba(0,0,0,.2); animation: up .18s ease-out;
}
@media (min-width: 640px) { .md { border-radius: 18px; padding: 22px; } }
@keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.md h2 { font-size: 21px; margin-bottom: 4px; }
.md .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.md-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.md-h h2 { flex: 1; }
.x { background: var(--unknown-bg); border: 0; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; }
.f { margin: 10px 0; }
.f label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
.f input[type=text], .f input[type=date], .f input[type=time], .f input[type=number], .f select, .f textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; font-size: 16px;
}
.f textarea { min-height: 84px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; }
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.seg button.on.booked { background: var(--booked); border-color: var(--booked); }
.seg button.on.pending { background: var(--pending); border-color: var(--pending); }
.seg button.on.unknown { background: var(--unknown); border-color: var(--unknown); }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cats button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 4px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cats button span { font-size: 20px; }
.cats button.on { background: #fff4ec; border-color: var(--accent); color: var(--accent); font-weight: 600; }
.note { background: #fff8ee; border: 1px solid #f3dcb8; border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }

/* Comments */
.cm { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.cm h3 { font-size: 15px; font-family: var(--font-body); margin-bottom: 8px; }
.c { background: var(--bg); border-radius: 10px; padding: 8px 11px; margin: 6px 0; font-size: 14px; }
.c .who { font-weight: 600; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }
.c-in { display: flex; gap: 8px; margin-top: 8px; }
.c-in input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 16px; }

/* Lists in modals */
.li { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .nm { font-weight: 600; }
.li .sm-muted { font-size: 12.5px; color: var(--muted); }
.menu { display: grid; gap: 6px; }
.menu button { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 15px; }
.menu button span.i { font-size: 20px; width: 26px; text-align: center; }
.menu button small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--bg); border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-all; }
.match { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
.match mark { background: #ffe58a; border-radius: 3px; }
.match .grow { flex: 1; }
.match .fld { color: var(--muted); font-size: 11.5px; text-transform: uppercase; }
table.diag { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.diag td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.diag td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* Footer */
.ftr {
  position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); z-index: 15; display: flex; justify-content: center; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap;
}
.ftr .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.ftr .booked { background: var(--booked); } .ftr .pending { background: var(--pending); } .ftr .unknown { background: var(--unknown); }
.ftr .u { margin-left: auto; cursor: pointer; text-decoration: underline dotted; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: up .2s; max-width: 90vw; text-align: center; }
.toast.err { background: #c0392b; }

/* Paste bar */
.pastebar { max-width: 760px; margin: 12px auto 0; padding: 0 16px; }
.pastebtn { width: 100%; background: linear-gradient(135deg, #fff4ea, #ffe9d6); border: 1px dashed #e0a878; color: #8a4a1e; border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 15px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.pastebtn small { font-weight: 400; color: #a0703f; font-size: 12.5px; }
.pastebtn:active { transform: scale(.995); }
textarea.big { min-height: 180px !important; font-size: 15px; }
textarea.drop { outline: 2px dashed var(--accent); background: #fff8f2; }
.dupe { margin-top: 6px; font-size: 12.5px; color: #8a4a1e; background: #fff4ea; border-radius: 8px; padding: 6px 8px; }
.dupe label { margin-right: 10px; }
.sync { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.14); }
.sync.ok { color: #9be7bd; } .sync.bad { color: #ffc7a3; }
.sec-h { font-family: var(--font-body); font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.tripcard { display: block; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin: 8px 0; text-decoration: none; color: var(--ink); border-left: 5px solid var(--accent); }
.tripcard .nm { font-weight: 600; font-size: 16px; font-family: var(--font-head); }
.mono-inline { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.sm-muted { font-size: 12.5px; color: var(--muted); }
.day.outside .day-h { border-bottom: 1px dashed #d9b48f; }
.day.outside .day-h .dn { font-size: 15px; color: #8a4a1e; }

</style>
</head>

<script>
/* Travel Planner — shared itinerary planner.
   Cloud mode: trips live in Supabase; anyone with the trip link can edit.
   Local mode (no config): trips live in this browser only. */
(function () {
  'use strict';

  // ---------- Date helpers (timezone-safe: NEVER use toISOString for dates) ----------
  const pad = n => (n < 10 ? '0' : '') + n;
  const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
  const todayStr = () => fmtDate(new Date());
  const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const niceDate = s => { const d = parseDate(s); return DOW[d.getDay()].slice(0, 3) + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
  const longDate = s => { const d = parseDate(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
  const isWeekend = s => { const g = parseDate(s).getDay(); return g === 0 || g === 6; };
  const ago = ts => {
    if (!ts) return '';
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago';
    return longDate(fmtDate(new Date(ts)));
  };
  const fmtTime12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; return ((h % 12) || 12) + ':' + pad(m) + ' ' + ap; };

  // ---------- Constants ----------
  const CATS = {
    flight: { icon: '✈️', label: 'Flight' }, hotel: { icon: '🏨', label: 'Hotel' }, train: { icon: '🚆', label: 'Train' },
    transfer: { icon: '🚕', label: 'Transfer' }, restaurant: { icon: '🍽️', label: 'Food' }, activity: { icon: '🎟️', label: 'Activity' },
    checkout: { icon: '🧳', label: 'Check-out' }, other: { icon: '📌', label: 'Other' }
  };
  const STATUS = { booked: 'Booked', pending: 'To Be Booked', unknown: 'Unknown' };
  const OWNER = { agent: 'Travel Agent', client: 'Client' };
  const USERKEY = 'travelplanner.user', RECENTKEY = 'travelplanner.recent', LOCALKEY = 'travelplanner.local', CACHEKEY = 'travelplanner.cache.';
  const CFG = window.TP_CONFIG || {};
  const CLOUD = !!(CFG.supabaseUrl && CFG.anonKey);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // ---------- Store: cloud (Supabase RPC) ----------
  const cloudStore = {
    async rpc(fn, args) {
      const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {
        method: 'POST', headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + CFG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify(args)
      });
      if (!r.ok) { let m = 'Server error ' + r.status; try { const j = await r.json(); m = j.message || j.hint || m; } catch (e) {} throw new Error(m); }
      const txt = await r.text(); return txt ? JSON.parse(txt) : null;
    },
    createTrip: (t, by) => cloudStore.rpc('trip_create', { p_name: t.name, p_start: t.startDate, p_end: t.endDate, p_travelers: t.travelers || '', p_by: by }),
    updateTrip: t => cloudStore.rpc('trip_update', { p_id: t.id, p_name: t.name, p_start: t.startDate, p_end: t.endDate, p_travelers: t.travelers || '' }),
    deleteTrip: id => cloudStore.rpc('trip_delete', { p_id: id }),
    getTrip: id => cloudStore.rpc('trip_get', { p_id: id }),
    version: id => cloudStore.rpc('trip_version', { p_id: id }),
    upsertItems: (id, items, by) => cloudStore.rpc('items_upsert', { p_trip: id, p_items: items, p_by: by }),
    deleteItems: (id, ids) => cloudStore.rpc('items_delete', { p_trip: id, p_ids: ids }),
    replaceAll: (id, items, by) => cloudStore.rpc('items_replace_all', { p_trip: id, p_items: items, p_by: by }),
    addComment: (id, itemId, c) => cloudStore.rpc('comment_add', { p_trip: id, p_item: itemId, p_id: c.id, p_author: c.author, p_text: c.text }),
    async parse(id, text, context) {
      const base = (CFG.functionsUrl || CFG.supabaseUrl.replace(/\/$/, '') + '/functions/v1');
      const r = await fetch(base + '/parse-itinerary', { method: 'POST', headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + CFG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ trip: id, text, context }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Could not reach the parser (' + r.status + ')');
      return j;
    }
  };

  // ---------- Store: local (this browser only) ----------
  const localStore = {
    all: () => lsGet(LOCALKEY, {}),
    put(db) { lsSet(LOCALKEY, db); },

    async updateTrip(t) { const db = this.all(); Object.assign(db[t.id], { name: t.name, startDate: t.startDate, endDate: t.endDate, travelers: t.travelers, updatedAt: Date.now() }); this.put(db); return this.pack(db[t.id]); },

    async getTrip(id) { const t = this.all()[id]; return t ? this.pack(t) : null; },
    async version(id) { const t = this.all()[id]; return t ? String(t.updatedAt) : null; },
    async upsertItems(id, items, by) { const db = this.all(); const t = db[id]; if (!t) throw new Error('no such trip'); items.forEach(n => { const ex = t.items.find(x => x.id === n.id); const row = { ...n, comments: ex ? ex.comments : (n.comments || []), editedBy: by, editedAt: Date.now() }; if (ex) Object.assign(ex, row); else t.items.push(row); }); t.updatedAt = Date.now(); this.put(db); return items.length; },

    async replaceAll(id, items, by) { const db = this.all(); db[id].items = []; this.put(db); return this.upsertItems(id, items, by); },
    async addComment(id, itemId, c) { const db = this.all(); const it = db[id].items.find(x => x.id === itemId); if (!it) throw new Error('no such item'); (it.comments = it.comments || []).push(c); db[id].updatedAt = Date.now(); this.put(db); },

  };
  const store = CLOUD ? cloudStore : localStore;

  // ---------- State ----------

  // ---------- DOM helpers ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function openModal(html) {

    $('#cok').onclick = () => { closeModal(); cb(); };
  }
  function busy(btn, on, label) { if (!btn) return; btn.disabled = on; if (on) { if (!btn.dataset.l) btn.dataset.l = btn.textContent; btn.textContent = label || 'Saving…'; } else if (btn.dataset.l) { btn.textContent = btn.dataset.l; delete btn.dataset.l; } }
  async function guarded(fn, btn, label) { try { busy(btn, true, label); await fn(); } catch (e) { console.error(e); toast(e.message || 'Something went wrong', true); } finally { busy(btn, false); } }

  // ---------- Loading & syncing ----------
  async function openTrip(code) {
    stopPolling();
    const cached = lsGet(CACHEKEY + code, null);

    else { $('#main').innerHTML = '<div class="welcome"><p>Loading trip…</p></div>'; }
    try {
      const fresh = await store.getTrip(code);
      if (!fresh) { forget(code); T = null; location.hash = ''; toast('That trip no longer exists', true); return renderHome(); }
      T = fresh; lsSet(CACHEKEY + code, T); remember(T.trip); lastVersion = await store.version(code).catch(() => null);
      render(); startPolling();
    } catch (e) {
      if (!cached) { $('#main').innerHTML = `<div class="welcome"><h2>Can't reach the trip</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`; }
      else toast('Offline — showing the last copy', true);
    }
  }
  async function refresh(silent) {

      const v = await store.version(T.trip.id);
      if (v === null) { forget(T.trip.id); T = null; location.hash = ''; renderHome(); toast('This trip was deleted', true); return; }
      if (v !== lastVersion || !silent) {
        const fresh = await store.getTrip(T.trip.id);
        if (fresh) { const changed = JSON.stringify(fresh) !== JSON.stringify(T); T = fresh; lsSet(CACHEKEY + T.trip.id, T); lastVersion = v; if (changed && !modalOpen()) render(); else if (changed) renderHeader(); if (!silent) toast(changed ? 'Updated' : 'Up to date'); }

  function startPolling() { stopPolling(); if (!CLOUD) return; pollTimer = setInterval(() => { if (document.visibilityState === 'visible') refresh(true); }, 15000); }
  function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T) refresh(true); });
  window.addEventListener('focus', () => { if (T) refresh(true); });
  function setOnline(ok) { const el = $('#sync'); if (!el) return; el.textContent = CLOUD ? (ok ? '● live' : '● offline') : '● this device only'; el.className = 'sync ' + (ok ? 'ok' : 'bad'); }

  function renderTimeline() {

    Object.values(byDate).forEach(a => a.sort((x, y) => (x.time || '99') < (y.time || '99') ? -1 : (x.time || '99') > (y.time || '99') ? 1 : 0));

    if (!html) html = `<div class="welcome"><p>No ${STATUS[filter] ? STATUS[filter].toLowerCase() : ''} items.</p></div>`;
    if (!items.length && filter === 'all') html = `<div class="welcome" style="padding:20px"><p>Nothing here yet. Paste the agent's email above, or use the <b>+</b> on any day.</p></div>` + html;
    $('#main').innerHTML = html;
    $('#main').querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); itemForm(null, b.dataset.add); });
    $('#main').querySelectorAll('[data-item]').forEach(c => c.onclick = () => itemForm(c.dataset.item));

  async function commitItem(it, form) {

  // Best-effort cleanup of raw .eml / HTML pastes so the parser sees readable text.
  function cleanEmail(s, name) {
    if (/\.(csv|json)$/i.test(name || '')) return s;
    let t = s;
    if (/^(Received|From|Subject|MIME-Version|Content-Type):/im.test(t.slice(0, 2000))) {
      // Decode base64 text parts, quoted-printable, drop attachments.
      t = t.replace(/Content-Transfer-Encoding:\s*base64[\s\S]*?\r?\n\r?\n([A-Za-z0-9+/=\r\n]+)/gi, (m, b) => { try { return '\n' + decodeURIComponent(escape(atob(b.replace(/\s/g, '')))) + '\n'; } catch (e) { return ''; } });
      t = t.replace(/=\r?\n/g, '').replace(/=([0-9A-F]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
    }
    if (/<\/?(html|body|div|table|p|br)\b/i.test(t)) {
      t = t.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>|<head[\s\S]*?<\/head>/gi, '').replace(/<br\s*\/?>|<\/(p|div|tr|li|h\d)>/gi, '\n').replace(/<[^>]+>/g, ' ');

  function normItem(i) {
    const cat = String(i.category || 'other').toLowerCase();

    const ow = String(i.owner || 'agent').toLowerCase();
    const o = { id: i.id != null && i.id !== '' ? String(i.id) : uid(), date: normDate(i.date), time: normTime(i.time), category: CATS[cat] ? cat : 'other', title: String(i.title || 'Untitled').trim(), details: String(i.details || '').trim(), status, owner: ow.includes('client') ? 'client' : 'agent' };

  function normDate(s) {

    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    const d = new Date(s); if (!isNaN(d)) return fmtDate(d);
    return todayStr();
  }
  function normTime(s) { if (!s) return ''; const m = String(s).trim().match(/^(\d{1,2}):(\d{2})/); return m ? pad(+m[1]) + ':' + m[2] : ''; }
  function parseImport(txt) {
    if (txt[0] === '{' || txt[0] === '[') {
      const j = JSON.parse(txt);
      if (Array.isArray(j)) return { items: j };
      if (Array.isArray(j.items)) return { trip: j.trip, items: j.items };
      if (Array.isArray(j.trips)) { const t = j.trips.find(x => x.id === j.activeTripId) || j.trips[0]; return { trip: t, items: t.items || [] }; }
      throw new Error('expected {"items":[…]}');
    }
    return { items: parseCSV(txt) };
  }
  function parseCSV(txt) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (q) { if (c === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    const hdr = rows.shift().map(h => h.trim().toLowerCase());
    if (!hdr.includes('title') || !hdr.includes('date')) throw new Error('CSV needs at least "date" and "title" columns');
    return rows.filter(r => r.some(x => x.trim())).map(r => { const o = {}; hdr.forEach((h, i) => o[h] = r[i]); return o; });
  }

  // ---------- Find & replace ----------
  const tidy = s => s.replace(/ {2,}/g, ' ').replace(/\s*([,;.])\s*(?=[,;.])/g, '$1').replace(/\(\s*\)/g, '').replace(/^\s*[,;]\s*/, '').replace(/\s*[,;]\s*$/, '').replace(/ +([,;.])/g, '$1').trim();
  function findReplaceDlg() {
    if (!T) return;
    openModal(`<div class="md-h"><h2>Find &amp; replace</h2><button class="x" data-close>✕</button></div>
      <div class="row2"><div class="f"><label>Find</label><input type="text" id="ff" placeholder="e.g. Business Class"></div><div class="f"><label>Replace with</label><input type="text" id="fr" placeholder="(leave empty to remove)"></div></div>
      <div class="f"><label>Search in</label><div class="seg" id="fw"><button type="button" data-w="both" class="on">Titles &amp; details</button><button type="button" data-w="title">Titles</button><button type="button" data-w="details">Details</button></div></div>
      <div class="f"><label><input type="checkbox" id="fc"> Match case</label></div>
      <div id="fres"></div><div class="btn-row"><button class="btn sec grow" id="fprev">Preview matches</button><button class="btn grow" id="fapply" disabled>Replace selected</button></div>`);
    let where = 'both', matches = [];
    document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { where = b.dataset.w; document.querySelectorAll('[data-w]').forEach(x => x.classList.toggle('on', x === b)); });
    const rx = () => { const f = $('#ff').value; if (!f) return null; return new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), $('#fc').checked ? 'g' : 'gi'); };
    $('#fprev').onclick = () => {
      const r = rx(); if (!r) return toast('Type something to find', true);
      matches = [];
      T.items.forEach(i => ['title', 'details'].forEach(f => { if (where !== 'both' && where !== f) return; if (i[f] && r.test(i[f])) matches.push({ i, f }); r.lastIndex = 0; }));
      $('#fres').innerHTML = matches.length ? `<p class="hint">${matches.length} match${matches.length > 1 ? 'es' : ''}</p>` + matches.map((m, k) => `<label class="match"><input type="checkbox" data-k="${k}" checked><div class="grow"><div class="fld">${niceDate(m.i.date)} · ${m.f}</div>${esc(m.i[m.f]).replace(r, x => '<mark>' + x + '</mark>')}</div></label>`).join('') : '<p class="hint">No matches.</p>';
      $('#fapply').disabled = !matches.length;
    };
    $('#fapply').onclick = () => {
      const r = rx(), rep = $('#fr').value;
      const chosen = [...document.querySelectorAll('[data-k]')].filter(cb => cb.checked).map(cb => matches[+cb.dataset.k]);
      const btn = $('#fapply');
      ensureUser(() => guarded(async () => {
        const touched = new Map();
        chosen.forEach(m => { const row = touched.get(m.i.id) || { ...m.i }; row[m.f] = tidy(row[m.f].replace(r, rep)); touched.set(m.i.id, row); });
        const batch = [...touched.values()];
        await store.upsertItems(T.trip.id, batch.map(stripLocal), user);
        batch.forEach(b => { const i = T.items.findIndex(x => x.id === b.id); T.items[i] = { ...b, editedBy: user, editedAt: Date.now() }; });
        closeModal(); await afterWrite(); toast(`Replaced in ${chosen.length} field${chosen.length === 1 ? '' : 's'}`);
      }, btn));
    };
  }

  // ---------- Diagnostics ----------
  function diagDlg() {
    const byCat = {}, byDate = {}, out = [];
    (T ? T.items : []).forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + 1; byDate[i.date] = (byDate[i.date] || 0) + 1; if (i.date < T.trip.startDate || i.date > T.trip.endDate) out.push(i); });
    openModal(`<div class="md-h"><h2>Diagnostics</h2><button class="x" data-close>✕</button></div>
      <table class="diag"><tr><td>Mode</td><td>${CLOUD ? 'Shared (cloud)' : 'This device only'}</td></tr><tr><td>Server</td><td>${CLOUD ? esc(CFG.supabaseUrl.replace(/^https?:\/\//, '')) : '—'}</td></tr>
      <tr><td>Your name</td><td>${esc(user || '—')}</td></tr><tr><td>Timezone</td><td>${Intl.DateTimeFormat().resolvedOptions().timeZone}</td></tr><tr><td>Trips remembered here</td><td>${recent().length}</td></tr>
      ${T ? `<tr><td>Trip code</td><td class="mono-inline">${esc(T.trip.id)}</td></tr><tr><td>Items</td><td>${T.items.length}</td></tr>
      ${Object.entries(byCat).map(([k, v]) => `<tr><td>&nbsp;&nbsp;${(CATS[k] || CATS.other).icon} ${CATS[k] ? CATS[k].label : k}</td><td>${v}</td></tr>`).join('')}
      <tr><td>Days with items</td><td>${Object.keys(byDate).length}</td></tr><tr><td>Items outside trip dates</td><td>${out.length}</td></tr><tr><td>Last server version</td><td>${esc(String(lastVersion || '—'))}</td></tr>` : ''}</table>
      ${out.length ? `<p class="hint" style="margin-top:10px">Outside range:</p>${out.map(i => `<div class="match"><div class="grow">${niceDate(i.date)} · ${esc(i.title)}</div></div>`).join('')}` : ''}
      <div class="btn-row">${T ? '<button class="btn sec grow" id="dcopy">Copy raw data</button>' : ''}<button class="btn danger" id="dwipe">Forget this device's data</button></div>`);
    if ($('#dcopy')) $('#dcopy').onclick = () => copy(JSON.stringify(payload(), null, 2), 'Raw data copied');
    $('#dwipe').onclick = () => confirmDlg('Clear this device?', CLOUD ? 'Removes the trip list and cached copies from this browser. Trips on the server are untouched — you can reopen them from their links.' : 'All trips on this device will be removed. Export a JSON backup first.', 'Clear', () => { Object.keys(localStorage).filter(k => k.startsWith('travelplanner.')).forEach(k => localStorage.removeItem(k)); user = ''; T = null; location.hash = ''; renderHome(); toast('Cleared'); }, true);
  }

  // ---------- Routing & boot ----------
  function route() { const code = codeFromHash(); if (code) openTrip(code); else renderHome(); }
  $('#menuBtn').onclick = menuDlg;
  $('#tripsBtn').onclick = tripsDlg;
  $('#shareBtn').onclick = shareDlg;
  $('#userName').onclick = nameDlg;
  $('#pasteBtn').onclick = () => pasteDlg();
  window.addEventListener('hashchange', route);
  route();
  window.TP = { get T() { return T; }, addDays, fmtDate, parseDate, cleanEmail, CLOUD }; // for tests / debugging
})();

</script>
</body>
</html>
